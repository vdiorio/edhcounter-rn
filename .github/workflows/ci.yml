name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Blocking gates — these catch the regressions this gate exists to prevent.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci

      # Non-blocking for now: the repo has pre-existing lint debt. Once it is
      # cleared, drop `continue-on-error` to make lint a blocking gate too.
      - name: Lint
        run: npm run lint
        continue-on-error: true
